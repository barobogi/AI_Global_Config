services:
  - type: web
    name: barobogi-second-brain-backend
    env: python
    rootDir: 65_android_apps/barobogi_second_brain/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
