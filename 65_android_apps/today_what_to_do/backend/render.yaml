services:
  - type: web
    name: today-what-to-do-backend
    env: python
    rootDir: 65_android_apps/today_what_to_do/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
